<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - AI Resume Screener</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; margin: 0; }
    .navbar { background: #1a1a2e; color: white; padding: 15px 30px; display: flex; justify-content: space-between; }
    .container { padding: 30px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card h3 { margin: 0; color: #666; font-size: 14px; }
    .card p { font-size: 28px; font-weight: bold; margin: 10px 0 0; }
    table { width: 100%; background: white; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #1a1a2e; color: white; }
    button { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; }
    .btn-danger { background: #ff4d4d; color: white; }
    .btn-primary { background: #4d79ff; color: white; }
  </style>
</head>
<body>
  <div class="navbar">
    <h2>AI Resume Screener - Admin</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <!-- Stats Cards -->
    <div class="stats">
      <div class="card"><h3>Total Users</h3><p id="totalUsers">0</p></div>
      <div class="card"><h3>Total Jobs</h3><p id="totalJobs">0</p></div>
      <div class="card"><h3>Resumes Screened</h3><p id="totalResumes">0</p></div>
      <div class="card"><h3>API Calls</h3><p id="totalAPI">0</p></div>
    </div>

    <!-- Manage Users -->
    <div class="card">
      <h2>Manage Users</h2>
      <table id="usersTable">
        <thead>
          <tr><th>Username</th><th>Role</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <button class="btn-primary" onclick="addUser()">+ Add User</button>
    </div>

    <!-- API Key Section -->
    <div class="card" style="margin-top:20px">
      <h2>API Access</h2>
      <p>Your API Key: <b id="apiKey">sk-demo-12345-ADMIN</b> <button onclick="copyKey()">Copy</button></p>
    </div>
  </div>

<script>
// 1. ROLE PROTECTION
const role = localStorage.getItem("role");
const token = localStorage.getItem("token");
if(role !== "admin"){
  alert("Access Denied. Admins only");
  window.location.href = "LoginPage.html";
}

// 2. LOAD DATA
async function loadData(){
  // Update stats
  document.getElementById("totalUsers").innerText = 3;
  document.getElementById("totalJobs").innerText = 12;
  document.getElementById("totalResumes").innerText = 145;
  document.getElementById("totalAPI").innerText = 1024;

  // Load users from backend
  try {
    const res = await fetch("http://localhost:8000/admin/users", {
      headers: {"Authorization": "Bearer " + token}
    });
    const data = await res.json();
    
    const tbody = document.querySelector("#usersTable tbody");
    tbody.innerHTML = "";

    // FIX: Loop through the LIST of users
    data.users.forEach(user => {
      tbody.innerHTML += `
        <tr>
          <td>${user.username}</td>
          <td>${user.role}</td>
          <td><button class="btn-danger" onclick="deleteUser('${user.username}')">Delete</button></td>
        </tr>
      `
    })
  } catch(err) {
    console.error(err);
    alert("Failed to load users");
  }
}

// 3. FUNCTIONS
function logout(){
  localStorage.clear();
  window.location.href = "LoginPage.html";
}
function copyKey(){
  navigator.clipboard.writeText(document.getElementById("apiKey").innerText);
  alert("API Key Copied");
}
function addUser(){ alert("Add User Modal - connect to backend later") }

async function deleteUser(username) {
    if(!confirm(`Are you sure you want to delete ${username}?`)) return;

    try {
        const res = await fetch(`http://localhost:8000/admin/users/${username}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });

        const data = await res.json();

        if (res.ok) {
            alert('✅ ' + data.message);
            loadData(); // FIX: was loadUsers()
        } else {
            alert('❌ ' + data.detail);
        }
    } catch (err) {
        alert('Cannot connect to backend');
        console.error(err);
    }
}

loadData(); // run on start
</script></body>
</html>
